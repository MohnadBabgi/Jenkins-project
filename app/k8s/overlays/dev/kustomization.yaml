apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base

# Build metadata (version, commit, build number, links) for the running build.
# Regenerated by Jenkins on every push to main.
patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: devops-status-app

# Dev tracks whatever Jenkins just built. The tag below is rewritten by the
# pipeline's "Update dev manifest" stage, which is what triggers ArgoCD to sync.
images:
  - name: muhnnad/devops-status-app
    newTag: "45"
