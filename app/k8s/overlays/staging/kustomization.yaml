apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

patches:
  - path: patch-service.yaml
    target:
      kind: Service
      name: devops-status-app

# Bumped manually when a build is promoted from dev; not touched by CI.
images:
  - name: muhnnad/devops-status-app
    newTag: "0.4.0"
