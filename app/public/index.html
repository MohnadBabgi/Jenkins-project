<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deployment status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="health" id="health" data-state="checking" role="status">
        <span class="health-dot" aria-hidden="true"></span>
        <span class="health-text">Checking health…</span>
      </p>
      <h1 class="headline" id="headline">Loading deployment…</h1>
      <p class="summary" id="summary"></p>
    </header>

    <section class="facts" id="status" aria-label="Current deployment">
      <div class="fact-group">
        <h2>Deployment</h2>
        <dl>
          <dt>Version</dt><dd data-field="version">–</dd>
          <dt>Commit</dt><dd data-field="commit">–</dd>
          <dt>Build</dt><dd data-field="buildNumber">–</dd>
          <dt>Deployed</dt><dd data-field="deployedAt">–</dd>
        </dl>
      </div>
      <div class="fact-group">
        <h2>Pods <span class="pod-count" id="pod-count"></span></h2>
        <ul class="pods" id="pods"></ul>
        <p class="pod-note">The Service sends each refresh to one pod, picked at random. A pod is listed once it has answered.</p>
      </div>
    </section>

    <section class="history" aria-labelledby="history-heading">
      <h2 id="history-heading">Deploy history</h2>
      <ol class="timeline" id="deploy-history"></ol>
    </section>

    <p class="footnote">Updates every 5 seconds.</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
