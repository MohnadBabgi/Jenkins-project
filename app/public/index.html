<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Status Page</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>It's alive</h1>
    <dl id="status">
      <dt>Hostname</dt><dd data-field="hostname">loading…</dd>
      <dt>Version</dt><dd data-field="version">loading…</dd>
      <dt>Server time</dt><dd data-field="now">loading…</dd>
      <dt>Uptime (s)</dt><dd data-field="uptime">loading…</dd>
    </dl>
    <p class="hint">refreshes every 5s from <code>/api/status</code></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
