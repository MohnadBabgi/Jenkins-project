apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-status-app-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MohnadBabgi/Jenkins-project.git
    targetRevision: main
    path: app/k8s/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    # Git is the source of truth. A promotion commit to overlays/staging/ deploys
    # on its own, and any manual change in the cluster (kubectl scale, edit,
    # delete) is reverted to match Git within seconds.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
