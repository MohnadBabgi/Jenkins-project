apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-status-app-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MohnadBabgi/Jenkins-project.git
    targetRevision: main
    path: app/k8s/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    # No `automated` block: staging is promoted deliberately. Bump the image
    # tag in overlays/staging/kustomization.yaml, then Sync by hand (UI or
    # `argocd app sync devops-status-app-staging`).
    syncOptions:
      - CreateNamespace=true
