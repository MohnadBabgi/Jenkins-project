apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-status-app-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MohnadBabgi/Jenkins-project.git
    targetRevision: main
    path: app/k8s/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    # No `automated` block: prod is promoted deliberately, same as staging.
    # Bump the image tag in overlays/prod/kustomization.yaml, then Sync by
    # hand (UI or `argocd app sync devops-status-app-prod`).
    syncOptions:
      - CreateNamespace=true
