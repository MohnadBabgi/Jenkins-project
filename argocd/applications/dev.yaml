apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-status-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MohnadBabgi/Jenkins-project.git
    targetRevision: main
    path: app/k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    # Dev tracks main automatically: every image-tag bump Jenkins commits
    # here gets applied without anyone clicking Sync.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
